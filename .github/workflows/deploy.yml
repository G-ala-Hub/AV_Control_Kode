name: Deploy to Crazy Domains

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        # Checkout the latest code from the repository
        # This ensures that the workflow runs with the latest commit on the main branch.

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          echo "Installed lftp."
        # lftp is required for deploying the code to the Crazy Domains server.

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.18.0'
        # Set up Node.js environment for the build.
        # This is necessary to install the project's dependencies.

      - name: Install dependencies
        working-directory: assets/contact-form-backend/server
        run: |
          npm install
          echo "Installed Node.js dependencies."
        # Install the required Node.js packages for the backend server.

      - name: List files and directories
        run: |
          echo "Listing files and directories:"
          ls -al
        # List files to verify the directory structure and files present.
        # Useful for debugging and ensuring the correct files are being deployed.

      - name: Deploy to Crazy Domains
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          echo "Starting deployment to Crazy Domains..."
          lftp -c "
          set ftp:ssl-allow no;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          mirror --reverse --delete --verbose --no-symlinks ./ $FTP_PATH
          "
          echo "Deployment to Crazy Domains completed."
        # Deploy the files to the Crazy Domains server.
        # The `--no-symlinks` option prevents errors related to symbolic links.

      - name: Start Backend Server with Production Variables
        env:
          NODE_ENV: production
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          PORT: ${{ secrets.PORT }}
        run: |
          echo "Starting backend server with production variables..."
          nohup node assets/contact-form-backend/server/server.js > server.log 2>&1 &
          echo "Backend server started. Logs can be found in server.log."
        # Start the backend server with production environment variables.
        # The server logs will be written to `server.log`.

      - name: Verify Backend Server is Running
        run: |
          sleep 5  # Wait for a few seconds to ensure the server starts
          curl -I https://www.avcontrolkode.com.au/send-email || echo "Server failed to start"
        # A simple check to verify if the backend server is running by sending a HEAD request to the server.
