name: Deploy to Crazy Domains

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          echo "Installed lftp."

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.18.0'

      - name: Install dependencies
        working-directory: assets/contact-form-backend/server
        run: |
          npm install
          echo "Installed Node.js dependencies."

      - name: Install pm2
        run: |
          sudo npm install -g pm2
          echo "Installed pm2."

      - name: List files and directories
        run: |
          echo "Listing files and directories:"
          ls -al

      - name: Deploy to Crazy Domains
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          echo "Starting deployment to Crazy Domains..."
          lftp -c "
          set ftp:ssl-allow no;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          mirror --reverse --delete --verbose --no-symlinks ./ $FTP_PATH
          "
          echo "Deployment to Crazy Domains completed."

      - name: Start Backend Server with pm2
        env:
          NODE_ENV: production
          CORS_ORIGIN: ${{ secrets.CORS_ORIGIN }}
          EMAIL_SERVICE: ${{ secrets.EMAIL_SERVICE }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          PORT: ${{ secrets.PORT }}
        run: |
          echo "Starting backend server with pm2..."
          pm2 start assets/contact-form-backend/server/server.js --name backend --env production
          pm2 save
          echo "Backend server started. Process list saved."

      - name: Check Backend Server Logs
        run: |
          echo "Checking backend server logs for errors..."
          pm2 logs backend --lines 100 | grep -i "error" || true
          if pm2 logs backend | grep -i "error"; then
            echo "Errors found in server log:";
            pm2 logs backend | grep -i "error";
            exit 1;
          else
            echo "No errors found in server log.";
          fi

      - name: Verify Backend Server is Running
        run: |
          sleep 5  # Wait for a few seconds to ensure the server starts
          curl -I https://www.avcontrolkode.com.au/send-email || { echo "Server failed to start"; exit 1; }
        # A simple check to verify if the backend server is running by sending a HEAD request to the server.

      - name: Send Test Email
        run: |
          echo "Sending test email to verify email functionality..."
          curl -X POST https://www.avcontrolkode.com.au/send-email \
            -H "Content-Type: application/json" \
            -d '{"name":"Test User", "email":"test@example.com", "subject":"Test", "message":"This is a test."}' \
          && echo "Test email sent successfully." || { echo "Failed to send test email"; exit 1; }
        # Send a test email to ensure the email functionality is working as expected.
