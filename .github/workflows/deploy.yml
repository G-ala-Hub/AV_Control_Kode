name: Deploy to Crazy Domains

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.18.0'

      - name: Install dependencies
        working-directory: assets/contact-form-backend/server
        run: npm install

      - name: List files and directories
        run: ls -al

      - name: Deploy to Crazy Domains
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          mirror --reverse --delete --verbose ./ $FTP_PATH
          "

      - name: Start Backend Server with Production Variables
        env:
          NODE_ENV: production
          CORS_ORIGIN: https://www.avcontrolkode.com.au
          EMAIL_SERVICE: outlook
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: info@avcontrolkode.com.au
          PORT: 80
        run: |
          nohup node assets/contact-form-backend/server/server.js &
