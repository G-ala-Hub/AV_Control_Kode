name: Deploy to Crazy Domains

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: List local files and directories
        run: ls -al

      - name: Clean FTP Server to Remove Existing Code
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          lftp -c "
          set ftp:ssl-force true;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          rm -r $FTP_PATH/* || echo 'No files to delete';
          echo 'Remote directory cleaned successfully.'
          "

      - name: Deploy Fresh Code to Crazy Domains
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          lftp -c "
          set ftp:ssl-force true;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          mirror --reverse --delete --verbose ./ $FTP_PATH;
          "
          echo "Fresh deployment to Crazy Domains completed."
