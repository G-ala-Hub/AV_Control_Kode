name: Deploy to Crazy Domains

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        # Checkout the latest code from the repository
        

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp
          echo "Installed lftp."

      - name: Install Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16.18.0'
        # Set up Node.js environment for the build
       

      - name: Install dependencies
        working-directory: assets/contact-form-backend/server
        run: |
          npm install
          echo "Installed Node.js dependencies."
      
      - name: List files and directories
        run: |
          echo "Listing files and directories:"
          ls -al
        # List files to verify the directory structure and files present

      - name: Deploy to Crazy Domains
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          echo "Starting deployment to Crazy Domains..."
          lftp -c "
          set ftp:ssl-allow no;
          open -u $FTP_USERNAME,$FTP_PASSWORD $FTP_SERVER;
          mirror --reverse --delete --verbose ./ $FTP_PATH
          "
          echo "Deployment to Crazy Domains completed."

      - name: Start Backend Server with Production Variables
        env:
          NODE_ENV: production
          CORS_ORIGIN: https://www.avcontrolkode.com.au
          EMAIL_SERVICE: outlook
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_RECIPIENT: info@avcontrolkode.com.au
          PORT: 80
        run: |
          echo "Starting backend server with production variables..."
          nohup node assets/contact-form-backend/server/server.js > server.log 2>&1 &
          echo "Backend server started. Logs can be found in server.log."
